[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bunnings-mcp"
version = "0.1.0"
description = "FastMCP server for Bunnings APIs - product search, stores, cart, and shopping lists"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
bunnings-mcp = "bunnings_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["bunnings_mcp"]
